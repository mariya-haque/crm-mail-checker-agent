<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Agent Chat</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --bubble-user: #2f6fed;
    --bubble-agent: #1f2330;
    --text: #e8e9ee;
    --muted: #8b8fa3;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chat-container {
    width: 100%;
    max-width: 640px;
    height: 90vh;
    background: var(--panel);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .chat-header {
    padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3ddc84;
  }
  .chat-header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }
  .chat-header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--bubble-agent);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: #3b1e24;
    color: #ff8a8a;
    border-bottom-left-radius: 4px;
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    padding: 4px 14px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  #question {
    flex: 1;
    background: #10121a;
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  #question:focus {
    border-color: var(--accent);
  }
  #sendBtn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .api-config {
    padding: 8px 14px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="dot"></div>
    <div>
      <h1>Mail Agent</h1>
      <p>Ask about emails from any sender</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg agent">Assalam-o-Alaikum! Mujhse pooch sakti hain, jaise: "cursor@thebotss.com se pichle month kitne emails aaye?"</div>
  </div>

  <div class="input-row">
    <input type="text" id="question" placeholder="Apna sawal likhein..." />
    <button id="sendBtn">Send</button>
  </div>
  <div class="api-config">Backend: <span id="apiUrlLabel">http://localhost:5000</span></div>
</div>

<script>
  const API_URL = "http://localhost:5000/ask"; // change if backend runs elsewhere
  const messagesEl = document.getElementById("messages");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.textContent = "Agent check kar raha hai...";
    div.id = "typingIndicator";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addMessage("Error: " + (data.error || "Something went wrong."), "error");
      } else {
        addMessage(data.answer, "agent");
      }
    } catch (err) {
      removeTyping();
      addMessage("Backend se connect nahi ho saka. Check karein ke api.py chal raha hai (python api.py).", "error");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", sendQuestion);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendQuestion();
  });
</script>

</body>
</html>
